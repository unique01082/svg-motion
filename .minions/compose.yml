# Test environment for Minions (Products → Test environment).
# Preview: web:80 / · Test login: none (public docs/playground).
# No environment variables, secrets, database, or seed step required.
# Uses the docs app's pinned npm release; library source checks use
# pnpm docs:candidate:verify separately.
services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    # Test env is served over plain http: drop upgrade-insecure-requests so CSS/JS load.
    entrypoint:
      - /bin/sh
      - -c
      - sed -i 's/; upgrade-insecure-requests//' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
